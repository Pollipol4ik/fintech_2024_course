name: Fintech - GitHub CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fj_2024_lesson_13
  pull_request:
    branches:
      - main
      - fj_2024_lesson_13
    paths:
      - .github/workflows/ci.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fintech_2024_course

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew clean build --refresh-dependencies

  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        run: ./gradlew test

      - name: Generate Jacoco report
        run: ./gradlew jacocoTestReport

      - name: Upload Jacoco Coverage Report
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

  lint:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run static code analysis
        run: ./gradlew check

  docker:
    permissions:
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get the version
        id: vars
        run: echo "::set-output name=tag::$(echo ${GITHUB_SHA:0:10})"

      - name: Log in to GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} .

      - name: Push Docker image to GitHub Packages
        run: docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

      - name: Docker login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKER_PASSWORD: ${{ secrets.dockerhub_password }}
        run: docker login -u="$DOCKER_USERNAME" -p="$DOCKER_PASSWORD" docker.io

      - name: Build and push Docker image to Docker Hub with tag
        run: |
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} ${{ secrets.dockerhub_username }}/${{ secrets.dockerhub_repo_name }}:${{ steps.vars.outputs.tag }}
          docker push ${{ secrets.dockerhub_username }}/${{ secrets.dockerhub_repo_name }}:${{ steps.vars.outputs.tag }}

      - name: Build and push Docker image to Docker Hub with latest tag
        run: |
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} ${{ secrets.dockerhub_username }}/${{ secrets.dockerhub_repo_name }}:latest
          docker push ${{ secrets.dockerhub_username }}/${{ secrets.dockerhub_repo_name }}:latest
