name: Fintech - GitHub CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fj_2024_lesson_13
  pull_request:
    branches:
      - main
      - fj_2024_lesson_13
    paths:
      - .github/workflows/ci.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fintech_2024_course

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean build --refresh-dependencies

  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:14.5-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for database
        run: sleep 15

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
        run: ./gradlew test

  coverage_report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Jacoco Coverage Report
        run: ./gradlew jacocoTestReport

      - name: Upload Jacoco Coverage Report
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 30
          title: Code Coverage
          update-comment: true

  lint:
    runs-on: ubuntu-latest
    needs: coverage_report
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run static analysis
        run: ./gradlew check

  docker:
    runs-on: ubuntu-latest
    needs: [lint, coverage_report]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean build --refresh-dependencies

      - name: Build Docker image
        run: docker build -t ghcr.io/pollipol4ik/fintech_2024_course:latest .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push ghcr.io/pollipol4ik/fintech_2024_course:latest
